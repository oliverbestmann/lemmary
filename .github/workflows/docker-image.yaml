# Build one multi-arch image and push it to GHCR.
#
# Called by a per-image workflow (docker-fork.yaml, docker-mailgate.yaml, ...)
# rather than triggered directly: everything here is the same for every image we
# publish, and the only things that differ -- which Dockerfile, which name, which
# paths are worth rebuilding for -- are the caller's inputs and its own `on:`
# block. A third image should be a twenty-line caller, not a copy of this file.
name: Docker image

on:
  workflow_call:
    inputs:
      image:
        description: "Image name under the registry, e.g. owner/repo-mailgate"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile, relative to the repository root"
        required: false
        default: Dockerfile
        type: string
      title:
        description: "org.opencontainers.image.title for the manifest"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  # Each platform is built natively on its own GitHub-hosted runner (no QEMU),
  # pushed to GHCR by digest only (no tag), then the merge job below stitches
  # the per-platform digests into one multi-arch manifest under the real tags.
  # See https://docs.docker.com/build/ci/github-actions/multi-platform/
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both go into an artifact name, where a slash is not allowed.
      - name: Prepare names
        run: |
          platform='${{ matrix.platform }}'
          image='${{ inputs.image }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_SLUG=${image//\//-}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ inputs.image }},push-by-digest=true,name-canonical=true
          # Scoped by image as well as platform: two images sharing one cache
          # scope would evict each other's layers on every push.
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # The artifact name carries the image too, so two image workflows
          # running on the same commit cannot collide in the artifact store.
          name: digests-${{ env.IMAGE_SLUG }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare names
        run: |
          image='${{ inputs.image }}'
          echo "IMAGE_SLUG=${image//\//-}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ env.IMAGE_SLUG }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # Both expansions are meant to word-split: one into -t flags, the other
          # into one image reference per digest file.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags \
            $(printf '${{ env.REGISTRY }}/${{ inputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ inputs.image }}:${{ steps.meta.outputs.version }}
